plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.h.simplecall'
    compileSdk 34

    defaultConfig {
        applicationId "com.h.simplecall"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.fragment:fragment-ktx:1.8.1'

    // kotlinx.coroutines: dùng trong ContactsRepository.kt (CoroutineScope, Dispatchers, launch,
    // Mutex, withContext...) - THIẾU dòng này gây lỗi biên dịch "tham chiếu chưa được giải quyết"
    // (unresolved reference) cho mọi import kotlinx.coroutines.*
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // lifecycle-runtime-ktx: cung cấp thuộc tính mở rộng "lifecycleScope" dùng trong
    // ContactsFragment.kt và StarredContactsFragment.kt - THIẾU dòng này cũng gây lỗi
    // "tham chiếu chưa được giải quyết: lifecycleScope"
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'

    // Room: lưu lịch sử cuộc gọi CỤC BỘ trong app (KHÔNG dùng CallLog provider của hệ thống nữa).
    implementation 'androidx.room:room-runtime:2.6.1'
    // room-ktx: BẮT BUỘC để dùng Flow<...> trong @Dao (vd CallHistoryDao.observeAll()) - thiếu
    // dòng này KSP báo lỗi "To use Coroutine features, you must add ktx artifact from Room".
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'
}
